spring.application.name=hospital-appointment-system

# Database Connection using your specific spelling
spring.datasource.url=${url}
spring.datasource.username=${usernamre}
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# IMPORTANT: Fix for Render/Aiven Dialect Error
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Twilio and JWT
account.sid=${ACCOUNT_SID}
auth.token=${AUTH_TOKEN}
from.phone=${FROM_PHONE}
jwt.secret=${JWT_SECRET}

# Render Port (Required)
server.port=${PORT:8082}

jwt.expiration=86400000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB